<!-- body.html - Updated for cursor-based placement -->

<a-scene
  dynamic-star-controller
  xrextras-gesture-detector
  hint-controller
  reset-view-button
  landing-page
  xrextras-loading
  xrextras-runtime-error
  renderer="colorManagement:true"
  xrweb="allowedDevices: any; disableWorldTracking: false"
  star-info-overlay
  asset-timeout="10000">
  <a-camera
    id="camera"
    position="0 1.6 0"
    raycaster="objects: .cantap, .clickable"
    cursor="fuse: false; rayOrigin: mouse;">
    <!-- Placement reticle. The graphic itself is the layered HUD ring that tap-place-cursor.js adds. -->
    <a-entity id="star-cursor" tap-place-cursor="placementDistance: 3.5" position="0 0 -5">
      <!-- <a-ring radius-inner="0.04" radius-outer="0.08"
        material="color: #00ff00; shader: flat; opacity: 0.6; transparent: true; side: double" position="0 0 0">
      </a-ring>

      <a-plane width="0.02" height="0.15" position="0 0 0.001"
        material="color: #00ff00; shader: flat; opacity: 0.9; transparent: true; side: double">
      </a-plane>

      <a-plane width="0.15" height="0.02" position="0 0 0.001"
        material="color: #00ff00; shader: flat; opacity: 0.9; transparent: true; side: double">
      </a-plane>
      <a-plane width="0.02" height="0.12" position="0 0 0.001" rotation="0 0 45"
        material="color: #00ff00; shader: flat; opacity: 0.9; transparent: true; side: double">
      </a-plane>

      <a-plane width="0.02" height="0.12" position="0 0 0.001" rotation="0 0 -45"
        material="color: #00ff00; shader: flat; opacity: 0.9; transparent: true; side: double">
      </a-plane>

      <a-animation attribute="scale" from="0.8 0.8 0.8" to="1.2 1.2 1.2" dur="1000" easing="ease-in-out-sine"
        direction="alternate" repeat="indefinite">
      </a-animation> -->
    </a-entity>
  </a-camera>

  <a-assets>
    <a-asset-item
      id="galaxy-sphere-skybox"
      src="assets/2k-space-skybox.glb"
      response-type="arraybuffer"></a-asset-item>
    <img id="blue-star-texture" src="assets/sunBlue.jpg" />
    <img id="red-star-texture" src="assets/sunRed.jpg" />
    <img id="white-star-texture" src="assets/sunWhite.jpg" />
  </a-assets>

  <a-light type="directional" intensity="0.5" position="1 1 1"></a-light>
  <a-light type="ambient" intensity="0.7"></a-light>

  <!-- Root entity - initially hidden until placement -->
  <a-entity id="root" position="0 0 -10" visible="false">
    <a-entity id="hider-walls"></a-entity>

    <a-entity id="portal"></a-entity>

    <a-entity
      constellation-loader="
        constellationFile: orion;
        showRealPositions: false;
        animationDuration: 2000">
    </a-entity>

    <a-entity
      id="galaxy-skybox"
      scale="25 25 25"
      position="0 0 1"
      gltf-model="#galaxy-sphere-skybox"
      spin="speed: 75000">
    </a-entity>
  </a-entity>
</a-scene>
