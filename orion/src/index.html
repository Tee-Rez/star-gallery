<!-- Verify all components are loaded correctly -->
<script>
  window.addEventListener('DOMContentLoaded', () => {
    console.log('THREE loaded:', typeof THREE !== 'undefined');
    console.log('EffectComposer loaded:', typeof THREE.EffectComposer !== 'undefined');
    console.log('ShaderPass loaded:', typeof THREE.ShaderPass !== 'undefined');
    console.log('TexturePass loaded:', typeof THREE.TexturePass !== 'undefined');
    console.log('UnrealBloomPass loaded:', typeof THREE.UnrealBloomPass !== 'undefined');

    // Wait for A-Frame to initialize
    setTimeout(() => {
      // Check if TexturePass exists
      console.log('Checking TexturePass availability...');
      if (!THREE.TexturePass) {
        console.error('TexturePass is missing, creating it manually');
        // Define TexturePass manually if it's missing
        THREE.TexturePass = function (map, opacity) {
          THREE.Pass.call(this);
          this.map = map;
          this.opacity = opacity !== undefined ? opacity : 1.0;
          this.uniforms = {
            tDiffuse: { value: null },
            tAdd: { value: this.map },
            opacity: { value: this.opacity },
          };
          this.material = new THREE.ShaderMaterial({
            uniforms: this.uniforms,
            vertexShader: [
              'varying vec2 vUv;',
              'void main() {',
              'vUv = uv;',
              'gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
              '}',
            ].join('\n'),
            fragmentShader: [
              'varying vec2 vUv;',
              'uniform sampler2D tDiffuse;',
              'uniform sampler2D tAdd;',
              'uniform float opacity;',
              'void main() {',
              'vec4 texel = texture2D(tDiffuse, vUv);',
              'vec4 add = texture2D(tAdd, vUv);',
              'gl_FragColor = texel + add * opacity;',
              '}',
            ].join('\n'),
          });
        };
        THREE.TexturePass.prototype = Object.assign(Object.create(THREE.Pass.prototype), {
          constructor: THREE.TexturePass,
          render: function (renderer, writeBuffer, readBuffer) {
            this.uniforms.tDiffuse.value = readBuffer.texture;
            this.uniforms.opacity.value = this.opacity;
            this.material.transparent = this.opacity < 1.0;
            THREE.Pass.prototype.render.call(this, renderer, writeBuffer, readBuffer);
          },
        });
      }
      console.log('TexturePass now available:', typeof THREE.TexturePass === 'function');
    }, 1000);
  });
</script>
