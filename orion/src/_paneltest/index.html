<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Temple panel - 3D model test</title>
<script src="../../external/scripts/8frame-1.3.0.min.js"></script>
<style>
  body { margin:0; background:#08090c; color:#cfe; font:13px system-ui, sans-serif; }
  a-scene { display:block; height:64vh; }
  .panel { padding:10px 14px; display:flex; gap:18px; flex-wrap:wrap; align-items:center; }
  .ctl { display:grid; gap:4px; font:12px ui-monospace, monospace; color:#8d8274; }
  .ctl b { color:#f0b458; font-weight:500; }
  input[type=range] { width:180px; accent-color:#f0b458; }
  #log { padding:0 14px 14px; font:12px ui-monospace, monospace; white-space:pre-wrap; color:#8d8274; }
</style>
</head>
<body>
<a-scene embedded background="color: #08090c" vr-mode-ui="enabled: false"
         renderer="colorManagement: true">
  <a-assets>
    <img id="room" src="room.png" crossorigin="anonymous">
    <a-asset-item id="info" src="../assets/models/temple-panel-info.glb"></a-asset-item>
    <a-asset-item id="btns" src="../assets/models/temple-panel-buttons.glb"></a-asset-item>
  </a-assets>

  <!-- the app's own lights, verbatim from body.html -->
  <a-light type="directional" intensity="0.5" position="1 1 1"></a-light>
  <a-light type="ambient" intensity="0.7"></a-light>

  <a-camera id="cam" position="0 0 0" look-controls-enabled="false" wasd-controls-enabled="false"></a-camera>
  <a-plane src="#room" width="18" height="10" position="0 0 -9" material="shader: flat"></a-plane>

  <!-- The band, at the same x offsets portal-header.js computes: info group centre -0.89, controls 1.39 -->
  <a-entity id="band" position="0 -0.2 -4.5">
    <a-entity position="-0.89 0 0">
      <a-entity gltf-model="#info" id="m-info"></a-entity>
      <a-text value="Constellation: Orion" font="roboto" width="1.9" align="left" color="#ffffff" position="-1.0 0.28 0.01"></a-text>
      <a-text value="# of Stars: 7 (5 explored)" font="roboto" width="1.9" align="left" color="#ffffff" position="-1.0 0.0 0.01"></a-text>
      <a-text value="Lore Journey Taken: Yes" font="roboto" width="1.9" align="left" color="#ffffff" position="-1.0 -0.28 0.01"></a-text>
    </a-entity>
    <a-entity position="1.39 0 0">
      <a-entity gltf-model="#btns" id="m-btns"></a-entity>
      <a-plane width="0.96" height="0.25" position="0 0.17 0.008" material="shader: flat; color: #000; opacity: 0.8; transparent: true"></a-plane>
      <a-text value="3D View" font="roboto" width="1.4" align="center" color="#fff" position="0 0.17 0.012"></a-text>
      <a-plane width="0.96" height="0.25" position="0 -0.17 0.008" material="shader: flat; color: #000; opacity: 0.8; transparent: true"></a-plane>
      <a-text value="Lore" font="roboto" width="1.4" align="center" color="#fff" position="0 -0.17 0.012"></a-text>
    </a-entity>
  </a-entity>
</a-scene>

<div class="panel">
  <label class="ctl">Yaw <b id="v-y">0&deg;</b><input id="y" type="range" min="-75" max="75" step="1" value="0"></label>
  <label class="ctl">Pitch <b id="v-p">0&deg;</b><input id="p" type="range" min="-40" max="40" step="1" value="0"></label>
  <label class="ctl">Distance <b id="v-d">4.5 m</b><input id="d" type="range" min="1.2" max="9" step="0.1" value="4.5"></label>
</div>
<div id="log">loading models...</div>

<script>
const band = document.getElementById('band');
const Y = document.getElementById('y'), P = document.getElementById('p'), Dd = document.getElementById('d');
function apply() {
  document.getElementById('v-y').textContent = Y.value + '°';
  document.getElementById('v-p').textContent = P.value + '°';
  document.getElementById('v-d').textContent = (+Dd.value).toFixed(1) + ' m';
  band.setAttribute('rotation', P.value + ' ' + (-Y.value) + ' 0');
  band.setAttribute('position', '0 -0.2 ' + (-Dd.value));
}
[Y, P, Dd].forEach(el => el.addEventListener('input', apply));
apply();

const out = [];
const ERR = [];
const realErr = console.error.bind(console);
console.error = (...a) => { ERR.push(a.map(String).join(' ')); realErr(...a) };
for (const id of ['m-info', 'm-btns']) {
  const el = document.getElementById(id);
  el.addEventListener('model-loaded', () => {
    const m = el.getObject3D('mesh');
    let tris = 0, mats = new Set();
    m.traverse(o => { if (o.isMesh) { tris += o.geometry.index ? o.geometry.index.count / 3 : o.geometry.attributes.position.count / 3; mats.add(o.material.name + ':' + o.material.type + (o.material.transparent ? '/transparent' : '')) } });
    out.push(id + ' loaded: ' + tris + ' tris, materials [' + [...mats].join(', ') + ']');
    document.getElementById('log').textContent = out.join('\n') + (ERR.length ? '\nERRORS:\n' + ERR.join('\n') : '');
  });
  el.addEventListener('model-error', (e) => { out.push(id + ' FAILED: ' + JSON.stringify(e.detail)); document.getElementById('log').textContent = out.join('\n') });
}
window.PANELTEST = () => ({lines: out, errors: ERR});

// 8frame will not start its loop without the XR system; drive the render directly.
const scene = document.querySelector('a-scene');
function loop(){ scene.object3D.updateMatrixWorld(true); if (scene.renderer && scene.camera) scene.renderer.render(scene.object3D, scene.camera); requestAnimationFrame(loop) }
setTimeout(loop, 1500);
</script>
</body>
</html>
